[project]
name = "ruko-companion"
version = "0.1.0"
description = "Conversational AI companion for the Ruko 1088 robot, built on top of Carle"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.50",
    "pywebview>=5.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyyaml>=6.0",
    "pyobjc-framework-avfoundation>=10.0",
    "pyobjc-framework-corebluetooth>=10.0",
    "pyobjc-framework-iobluetooth>=10.0",
]

[project.optional-dependencies]
local-stt = ["faster-whisper>=1.0"]
local-tts = ["kokoro-onnx>=0.4"]

[project.scripts]
companion = "companion.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
